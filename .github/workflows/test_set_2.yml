name: test_set_2

on: workflow_call

permissions:
  contents: read

jobs:
  unit_compatibility:
    if: github.repository_owner == 'hwdsl2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and HTTP compatibility
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python -m unittest discover -s .github/workflows/tests
          test_venv=$(mktemp -d "$RUNNER_TEMP/whisper-unit.XXXXXX")
          trap 'rm -rf -- "$test_venv"' EXIT
          python -m venv "$test_venv"
          "$test_venv/bin/pip" install --disable-pip-version-check fastapi python-multipart uvicorn httpx
          "$test_venv/bin/python" .github/workflows/tests/check_api_http.py api_server.py

  test_set_2:
    timeout-minutes: 60
    if: github.repository_owner == 'hwdsl2'
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/workflows/tests
      - name: Prepare candidate API fixture
        run: |
          set -euo pipefail
          fixture_dir=$(mktemp -d "$RUNNER_TEMP/whisper-candidate.XXXXXX")
          echo "WHISPER_FIXTURE=$fixture_dir" >> "$GITHUB_ENV"
          bash .github/workflows/tests/prepare_fixture.sh "$fixture_dir" http://127.0.0.1:8765
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$fixture_dir" >"$fixture_dir/server.log" 2>&1 &
          echo "$!" > "$fixture_dir/server.pid"
          for attempt in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:8765/api_server.py -o /dev/null; then
              break
            fi
            [ "$attempt" -lt 30 ] || exit 1
            sleep 1
          done
          sudo bash "$fixture_dir/check_bad_checksum.sh" "$fixture_dir"
      - name: Test
        run: |
          set -ex

          cd "$GITHUB_WORKSPACE"
          ls -ld whisper-install.sh

          cp -f "$WHISPER_FIXTURE/whisper.sh" ./whisper.sh

          wait_for_whisper() {
            local port="$1"
            local i=0
            while [ "$i" -lt 300 ]; do
              if curl -sf "http://127.0.0.1:${port}/health" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
              i=$((i + 1))
            done
            return 1
          }

          sudo bash whisper.sh --auto

          sudo systemctl status whisper.service
          sudo test -f /etc/whisper/whisper.conf
          sudo test -f /opt/whisper/api_server.py
          sudo test -d /opt/whisper/venv
          sudo grep -q 'WHISPER_MODEL=base' /etc/whisper/whisper.conf
          sudo grep -q 'WHISPER_PORT=9000' /etc/whisper/whisper.conf
          sudo grep -q 'WHISPER_LISTEN_ADDR=0.0.0.0' /etc/whisper/whisper.conf
          sudo grep -q 'WHISPER_MAX_REQUEST_BEAM=10' /etc/whisper/whisper.conf
          sudo grep -q '^WHISPER_API_KEY=whisper-' /etc/whisper/whisper.conf
          whisper_key=$(sudo bash whisper.sh --getkey)
          [ -n "$whisper_key" ] || { echo "Generated Whisper API key not found"; exit 1; }
          sudo bash whisper.sh --showkey | grep -q "$whisper_key"
          sudo sed -i 's/^WHISPER_API_KEY=.*/WHISPER_API_KEY=/' /etc/whisper/whisper.conf
          if sudo bash whisper.sh --getkey; then
            echo "Expected no Whisper API key after blanking WHISPER_API_KEY"
            exit 1
          fi
          sudo sed -i "s/^WHISPER_API_KEY=.*/WHISPER_API_KEY=$whisper_key/" /etc/whisper/whisper.conf

          sudo bash whisper.sh --showinfo
          sudo bash whisper.sh --listmodels
          sudo bash whisper.sh --listmodels | grep -q 'base'
          sudo bash whisper.sh --listmodels | grep -q 'large-v3-turbo'

          # Wait for server to be ready (up to 300 seconds for model download)
          wait_for_whisper 9000

          # Verify health endpoint
          curl -sf http://127.0.0.1:9000/health

          # Test auth enforcement when WHISPER_API_KEY is generated
          http_code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:9000/v1/models 2>/dev/null || true)
          [ "$http_code" = "401" ] || { echo "Expected 401 without key, got $http_code"; exit 1; }
          whisper_curl_args=(-H "Authorization: Bearer $whisper_key")

          # Verify models endpoint
          curl -sf "${whisper_curl_args[@]}" http://127.0.0.1:9000/v1/models | grep -q '"object"'

          # Generate a minimal test audio file
          if [ ! -x /usr/bin/ffmpeg ]; then
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get -yqq update
            sudo apt-get -yqq install ffmpeg
          fi
          ffmpeg -y -f lavfi -i "sine=frequency=440:duration=1" -ar 16000 -ac 1 /tmp/test.wav

          expect_transcription_400() {
            http_code=$(curl -s -o /dev/null -w '%{http_code}' \
              "${whisper_curl_args[@]}" \
              http://127.0.0.1:9000/v1/audio/transcriptions \
              "$@" 2>/dev/null || true)
            [ "$http_code" = "400" ] || { echo "Expected 400, got $http_code"; exit 1; }
          }

          expect_transcription_400 \
            -F file=@/tmp/test.wav -F model=gpt-4o-transcribe-diarize
          expect_transcription_400 \
            -F file=@/tmp/test.wav -F model=whisper-1 -F response_format=diarized_json
          expect_transcription_400 \
            -F file=@/tmp/test.wav -F model=whisper-1 -F 'include[]=logprobs'
          expect_transcription_400 \
            -F file=@/tmp/test.wav -F model=whisper-1 -F chunking_strategy=auto
          expect_transcription_400 \
            -F file=@/tmp/test.wav -F model=whisper-1 -F 'known_speaker_names[]=agent'
          expect_transcription_400 \
            -F file=@/tmp/test.wav -F model=whisper-1 -F 'known_speaker_references[]=data:audio/wav;base64,AAAA'
          expect_transcription_400 \
            -F file=@/tmp/test.wav -F model=whisper-1 -F temperature=1.01
          expect_transcription_400 \
            -F file=@/tmp/test.wav -F model=whisper-1 -F beam=11

          http_code=$(curl -s -o /dev/null -w '%{http_code}' \
            "${whisper_curl_args[@]}" \
            http://127.0.0.1:9000/v1/audio/translations \
            -F file=@/tmp/test.wav -F model=whisper-1 -F temperature=-0.01 2>/dev/null || true)
          [ "$http_code" = "400" ] || { echo "Expected 400 for invalid translation temperature, got $http_code"; exit 1; }

          # Test transcription endpoint (json format)
          curl -sf "${whisper_curl_args[@]}" http://127.0.0.1:9000/v1/audio/transcriptions \
            -F file=@/tmp/test.wav -F model=whisper-1 -F beam=1 \
            | grep -q '"text"'

          # Test transcription endpoint (text format)
          curl -sf "${whisper_curl_args[@]}" http://127.0.0.1:9000/v1/audio/transcriptions \
            -F file=@/tmp/test.wav -F model=whisper-1 -F response_format=text

          # Test transcription endpoint (verbose_json format)
          curl -sf "${whisper_curl_args[@]}" http://127.0.0.1:9000/v1/audio/transcriptions \
            -F file=@/tmp/test.wav -F model=whisper-1 -F response_format=verbose_json \
            | grep -q '"segments"'

          # Test transcription endpoint (srt format)
          curl -sf "${whisper_curl_args[@]}" http://127.0.0.1:9000/v1/audio/transcriptions \
            -F file=@/tmp/test.wav -F model=whisper-1 -F response_format=srt

          # Test transcription endpoint (vtt format)
          curl -sf "${whisper_curl_args[@]}" http://127.0.0.1:9000/v1/audio/transcriptions \
            -F file=@/tmp/test.wav -F model=whisper-1 -F response_format=vtt

          # Test transcription endpoint with explicit language
          curl -sf "${whisper_curl_args[@]}" http://127.0.0.1:9000/v1/audio/transcriptions \
            -F file=@/tmp/test.wav -F model=whisper-1 -F language=en \
            | grep -q '"text"'

          # Test streaming transcription endpoint (stream=true, SSE)
          stream_output=$(curl -sN "${whisper_curl_args[@]}" http://127.0.0.1:9000/v1/audio/transcriptions \
            -F file=@/tmp/test.wav -F model=whisper-1 -F stream=true)
          echo "$stream_output" | grep -q '"transcript.text.done"'
          echo "$stream_output" | grep -q '\[DONE\]'

          sudo bash "$WHISPER_FIXTURE/check_systemd_decoding.sh" "$WHISPER_FIXTURE"

          sudo bash whisper.sh --uninstall --yes

          sudo test -f /etc/systemd/system/whisper.service && exit 1
          sudo test -f /etc/whisper/whisper.conf && exit 1
          sudo test -d /opt/whisper && exit 1

          # Test --auto with custom model and port
          sudo bash whisper.sh --auto --model tiny --port 9001

          sudo systemctl status whisper.service
          sudo grep -q 'WHISPER_MODEL=tiny' /etc/whisper/whisper.conf
          sudo grep -q 'WHISPER_PORT=9001' /etc/whisper/whisper.conf
          sudo bash whisper.sh --getkey | grep -q '^whisper-'

          sudo bash whisper.sh --uninstall --yes

          sudo test -f /etc/whisper/whisper.conf && exit 1

          # Test --listenaddr option
          sudo bash whisper.sh --auto --listenaddr 127.0.0.1

          sudo systemctl status whisper.service
          sudo grep -q 'WHISPER_LISTEN_ADDR=127.0.0.1' /etc/whisper/whisper.conf
          sudo bash whisper.sh --getkey | grep -q '^whisper-'

          sudo bash whisper.sh --uninstall --yes

          sudo test -f /etc/whisper/whisper.conf && exit 1

          # Explicit empty key preserves no-auth behavior.
          sudo rm -rf /var/lib/whisper
          sudo env WHISPER_API_KEY= bash whisper.sh --auto --model tiny --port 9002
          sudo grep -q '^WHISPER_API_KEY=$' /etc/whisper/whisper.conf
          if sudo bash whisper.sh --getkey; then
            echo "Expected no Whisper API key for explicit empty key install"
            exit 1
          fi
          wait_for_whisper 9002
          curl -sf http://127.0.0.1:9002/v1/models | grep -q '"object"'

          sudo bash whisper.sh --uninstall --yes

          # Preserved model cache still gets a key on a new install.
          sudo rm -rf /var/lib/whisper
          sudo mkdir -p /var/lib/whisper
          printf '%s' 'existing' | sudo tee /var/lib/whisper/.model >/dev/null
          sudo bash whisper.sh --auto --model tiny --port 9003
          sudo grep -q '^WHISPER_API_KEY=whisper-' /etc/whisper/whisper.conf
          whisper_key=$(sudo bash whisper.sh --getkey)
          [ -n "$whisper_key" ] || { echo "Generated Whisper API key not found"; exit 1; }
          wait_for_whisper 9003
          http_code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:9003/v1/models 2>/dev/null || true)
          [ "$http_code" = "401" ] || { echo "Expected 401 without key, got $http_code"; exit 1; }
          curl -sf -H "Authorization: Bearer $whisper_key" \
            http://127.0.0.1:9003/v1/models | grep -q '"object"'

          sudo bash whisper.sh --uninstall --yes

          exit 0
      - name: Clear candidate fixture
        if: always()
        run: |
          if [[ -n "${WHISPER_FIXTURE:-}" && "$WHISPER_FIXTURE" == "$RUNNER_TEMP"/whisper-candidate.* ]]; then
            if [ -f "$WHISPER_FIXTURE/server.pid" ]; then
              kill "$(cat "$WHISPER_FIXTURE/server.pid")" 2>/dev/null || true
            fi
            sudo rm -rf -- "$WHISPER_FIXTURE"
          fi
          rm -f ./whisper.sh
